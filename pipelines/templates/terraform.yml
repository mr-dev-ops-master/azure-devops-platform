# Template: Terraform steps for one environment (used by azure-pipelines-infra.yml)
parameters:
  - name: environment
    type: string
  - name: serviceConnection
    type: string
  - name: apply
    type: boolean
    default: false

steps:
  - checkout: self

  - bash: |
      set -e
      curl -sSLo tf.zip "https://releases.hashicorp.com/terraform/$(tfVersion)/terraform_$(tfVersion)_linux_amd64.zip"
      sudo unzip -o -q tf.zip -d /usr/local/bin
      terraform -version
    displayName: Install Terraform

  - task: AzureCLI@2
    displayName: Terraform ${{ parameters.environment }} (${{ iif(parameters.apply, 'plan + apply', 'plan') }})
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true          # exposes client id, tenant id and OIDC token
      workingDirectory: $(System.DefaultWorkingDirectory)/terraform
      inlineScript: |
        set -e
        export ARM_CLIENT_ID=$servicePrincipalId ARM_TENANT_ID=$tenantId ARM_OIDC_TOKEN=$idToken ARM_USE_OIDC=true
        export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
        export ARM_RESOURCE_PROVIDER_REGISTRATIONS=none TF_IN_AUTOMATION=true
        export TF_VAR_alert_email="$(alertEmail)"
        terraform init -input=false \
          -backend-config="resource_group_name=$(tfStateRg)" \
          -backend-config="storage_account_name=$(tfStateSa)" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=${{ parameters.environment }}.terraform.tfstate" \
          -backend-config="use_oidc=true" -backend-config="use_azuread_auth=true"
        terraform validate
        terraform plan -input=false -no-color -var-file=environments/${{ parameters.environment }}.tfvars -out tfplan
        if [ "${{ parameters.apply }}" = "True" ]; then
          terraform apply -input=false tfplan
        fi
