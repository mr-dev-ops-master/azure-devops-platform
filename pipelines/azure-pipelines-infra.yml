# Azure DevOps - Infrastructure pipeline: Validate -> Dev -> Prod (approval)
trigger:
  branches: { include: [main] }
  paths: { include: [terraform/*, pipelines/azure-pipelines-infra.yml, pipelines/templates/*] }

pr:
  branches: { include: [main] }
  paths: { include: [terraform/*] }

pool:
  vmImage: ubuntu-latest

variables:
  - group: platform-common      # tfStateRg, tfStateSa, alertEmail (Library > Variable groups)
  - name: tfVersion
    value: 1.9.8

stages:
  - stage: Validate
    jobs:
      - job: Lint
        steps:
          - bash: |
              curl -sSLo tf.zip "https://releases.hashicorp.com/terraform/$(tfVersion)/terraform_$(tfVersion)_linux_amd64.zip"
              sudo unzip -o -q tf.zip -d /usr/local/bin
              cd terraform
              terraform fmt -check -recursive
              terraform init -backend=false -input=false
              terraform validate
            displayName: fmt + validate
          - bash: |
              curl -sSL https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
              cd terraform && tflint --init && tflint --format compact
            displayName: TFLint (azurerm ruleset)
          - bash: |
              pip install --quiet checkov
              checkov -d terraform --framework terraform --config-file terraform/.checkov.yaml \
                --output cli --output junitxml --output-file-path console,checkov-results.xml --soft-fail
            displayName: Checkov IaC security scan
          - task: PublishTestResults@2
            condition: always()
            displayName: Publish Checkov results
            inputs: { testResultsFiles: checkov-results.xml, testRunTitle: Checkov }
          - bash: |
              docker run --rm -v "$(Build.SourcesDirectory):/repo" zricethezav/gitleaks:latest \
                detect --source /repo --no-banner --redact
            displayName: Gitleaks secret scan
      - job: PlanProd
        displayName: Plan prod (preview)
        steps:
          - template: templates/terraform.yml
            parameters:
              environment: prod
              serviceConnection: sc-azure-prod

  - stage: Dev
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: ApplyDev
        environment: dev
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/terraform.yml
                  parameters:
                    environment: dev
                    serviceConnection: sc-azure-dev
                    apply: true

  - stage: Prod
    dependsOn: Dev
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: ApplyProd
        environment: prod          # add an Approvals check on this environment
        strategy:
          runOnce:
            deploy:
              steps:
                - template: templates/terraform.yml
                  parameters:
                    environment: prod
                    serviceConnection: sc-azure-prod
                    apply: true
